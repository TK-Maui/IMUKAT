<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IMUKAT テスト版</title>
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --ink:#1b2430; --sub:#5b6878; --line:#d5dde8;
  --accent:#6b3fd1; --accent-ink:#fff; --warn:#c2410c; --ok:#15803d; --gold:#b7791f; --gold-bg:#fdf3dc;
  --cell:#f4f6fa; --cell2:#e9edf4; --fixed:#dfe5ee; --hi:#fde68a; --reach:#d9ccff; --part:#7c4dbb; --alarm:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131b; --panel:#191e2a; --ink:#e6e9f2; --sub:#9aa3b8; --line:#2c3446;
    --accent:#9b7cf0; --accent-ink:#11131b; --warn:#fb923c; --ok:#4ade80; --gold:#f0b44c; --gold-bg:#3a2e14;
    --cell:#1d2331; --cell2:#232a3a; --fixed:#2d3548; --hi:#6b5b17; --reach:#3b2f66; --part:#b392f0; --alarm:#f87171;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.5}
body{padding:10px 58px 90px 12px;max-width:820px;margin:0 auto}
h1{font-size:20px;margin:6px 0 2px}
h2{font-size:16px;margin:12px 0 6px}
.sub{color:var(--sub);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.panel.warn{border-color:var(--warn)}
.panel.me{border-color:var(--accent);border-width:2px}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;min-height:42px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.on{outline:2px solid var(--accent);outline-offset:1px}
button.danger{border-color:var(--warn);color:var(--warn)}
button:disabled{opacity:.45;cursor:not-allowed}
button small{display:block;font-size:11px;font-weight:400;opacity:.85}
input,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-height:42px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--cell2);border:1px solid var(--line)}
.pchip{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.pchip:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--pc)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto}
/* マップ */
.floorwrap{margin:8px 0}
.floorttl{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:14px}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:100%;max-width:460px;margin:4px auto;position:relative}
.cell{aspect-ratio:1;border-radius:5px;background:var(--cell);border:1px solid var(--line);position:relative;padding:0;min-height:0;font-size:11px;line-height:1;overflow:hidden;color:var(--ink)}
.cell.q1{background:var(--cell2)}
.cell.fx{background:var(--fixed)}
.cell.reach{background:var(--reach);border-color:var(--accent)}
.cell.sel{box-shadow:inset 0 0 0 3px var(--accent);background:var(--hi)}
.cell.tap{cursor:pointer}
.cell .fxl{position:absolute;left:2px;top:1px;font-size:10px;font-weight:700;color:var(--sub)}
.cell .co{position:absolute;right:2px;bottom:1px;font-size:8px;color:var(--sub);opacity:.75}
.cell .tr{position:absolute;inset:18% 18%;border-radius:50%;background:var(--gold-bg);border:2px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px}
.cell .tr.alarm{border-color:var(--alarm);color:var(--alarm);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
@media (prefers-reduced-motion: reduce){.cell .tr.alarm{animation:none}}
.cell .pt{position:absolute;right:2px;top:1px;font-size:10px;font-weight:800;color:var(--part)}
.cell .tr.gone{opacity:.35;border-style:dashed}
.cell .pt.gone{opacity:.35;text-decoration:line-through}
.cell .seen{position:absolute;left:2px;top:12px;font-size:9px;font-weight:700;color:var(--ok)}
.cell .fp{position:absolute;bottom:3px;left:3px;display:flex;gap:1px;flex-wrap:wrap;max-width:70%}
.cell .fp i{width:8px;height:8px;border-radius:50%;display:block;background:var(--pc)}
.cell .fp i.old{opacity:.35}
.cell .fp i.fake{outline:1px dashed var(--ink)}
.cell .tk{position:absolute;inset:22%;border-radius:50%;background:var(--pc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid #fff;box-shadow:0 0 0 1px var(--pc)}
.cell .tk.two{inset:auto;width:46%;height:46%}
.cell .tk.cap{background:#555;box-shadow:0 0 0 2px var(--pc)}
.cell .plan{position:absolute;inset:8%;border-radius:50%;border:2px dashed var(--pc)}
.cell .dt{position:absolute;inset:14%;display:flex;align-items:center;justify-content:center;font-size:20px}
.cell .mk{position:absolute;left:2px;bottom:1px;font-size:11px}
.cell .rv{position:absolute;inset:6%;border:2px solid var(--warn);border-radius:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub);margin:4px 0}
/* 端のアイコン */
.side{position:fixed;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:20}
.side button{width:44px;height:44px;border-radius:50%;padding:0;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.18);position:relative}
.side button .badge{position:absolute;top:-4px;right:-4px;background:var(--accent);color:var(--accent-ink);font-size:11px;border-radius:99px;min-width:18px;height:18px;line-height:18px;font-weight:700}
.side button span.lb{position:absolute;right:50px;top:12px;font-size:11px;white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 4px;display:none}
.side button:hover span.lb{display:block}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:14px;max-width:min(620px,94vw);width:94vw;max-height:86vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
.card{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:var(--bg)}
.card.notice{border-color:var(--gold);background:var(--gold-bg)}
.card b{font-size:15px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;z-index:99;max-width:90vw;font-size:14px}
.timerbar{display:flex;gap:8px;align-items:center;margin:6px 0}
#timerbadge{font-weight:700;padding:2px 10px;border-radius:99px;background:var(--cell2)}
#timerbadge.warn{background:var(--warn);color:#fff}
.log{max-height:260px;overflow:auto;font-size:12px}
.log div{border-bottom:1px dashed var(--line);padding:2px 0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{white-space:nowrap}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:6px}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.stat div{background:var(--bg);border-radius:8px;padding:6px 8px;font-size:13px}
.big{font-size:22px;font-weight:800;letter-spacing:2px}
.ok{color:var(--ok)} .ng{color:var(--warn)}
/* 結果のポップアップ */
#notebox{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:70px 16px 16px;background:rgba(0,0,0,.35)}
#notebox .nwrap{width:min(440px,100%);display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 90px);overflow:auto}
.ncard{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:npop .18s ease-out}
.ncard.good{border-left-color:var(--ok)}.ncard.bad{border-left-color:var(--warn)}
.ncard .nt{display:flex;gap:10px;align-items:center;font-weight:800;font-size:17px}
.ncard .ni{font-size:28px;line-height:1}
.ncard ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.ncard .nm{font-size:11px;color:var(--sub);margin-top:4px}
#notebox .nok{width:100%;margin-top:2px}
@keyframes npop{from{transform:translateY(-8px) scale(.97);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.ncard{animation:none}}
/* 変装パーツ */
.parts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.partchip{font-size:12px;padding:2px 8px;border-radius:99px;border:1px dashed var(--line);color:var(--sub)}
.partchip.on{border:1px solid var(--part);background:color-mix(in srgb,var(--part) 16%,var(--panel));color:var(--ink);font-weight:700}
.partchip.on:before{content:"✓ "}
.partchip.dup:after{content:attr(data-n)}
</style>
</head>
<body>
<div id="app"></div>
<div class="side" id="side"></div>
<dialog id="dlg"></dialog>
<script src="engine.js"></script>
<script src="rules.js"></script>
<script>
"use strict";
const E=window.IMUKAT;
const VERSION=E.VERSION;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const CODE_CH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const makeCode=()=>Array.from({length:5},()=>CODE_CH[Math.floor(Math.random()*CODE_CH.length)]).join("");

/* ================= 通信（SkyPiratesと同じ方式） =================
   直接通信（PeerJS）でつなぎ、つながらない回線のときは公開の中継サーバー（MQTT）を経由する。
   部屋を作った人の端末がゲームの親。親の状態は端末に保存され、閉じても「前回の部屋を再開」で続けられる。 */
const S={mode:null,game:null,seat:null,view:null,code:null,peer:null,conns:new Map(),hostConn:null,ui:{},hist:[],myName:""};
function loadPeerJS(){
  return new Promise((res,rej)=>{
    if(window.Peer)return res();
    const urls=["https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js","https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"];
    const tryLoad=k=>{if(k>=urls.length)return rej(new Error("通信ライブラリを読み込めませんでした。電波の良い場所で、もう一度試してください"));
      const s=document.createElement("script");s.src=urls[k];let done=false;
      const tm=setTimeout(()=>{if(!done){done=true;s.remove();tryLoad(k+1)}},10000);
      s.onload=()=>{if(done)return;done=true;clearTimeout(tm);window.Peer?res():tryLoad(k+1)};
      s.onerror=()=>{if(done)return;done=true;clearTimeout(tm);s.remove();tryLoad(k+1)};
      document.head.appendChild(s)};
    tryLoad(0);
  });
}
function bcTransport(){
  class BCConn{constructor(ch,self,other){this.ch=ch;this.self=self;this.peer=other;this.h={};this.open=true}
    on(e,f){(this.h[e]=this.h[e]||[]).push(f)} emit(e,x){(this.h[e]||[]).forEach(f=>f(x))}
    send(d){if(new TextEncoder().encode(JSON.stringify(d)).length>16384){console.warn("BC: 16KBを超えたので届かない（実機の再現）");return}this.ch.postMessage({to:this.peer,from:this.self,d})}
    close(){this.open=false}}
  class BCPeer{constructor(id){this.id=id||("g"+Math.random().toString(36).slice(2,8));this.h={};this.conns={};
      this.ch=new BroadcastChannel("imukat-test");
      this.ch.onmessage=e=>{const m=e.data;if(m.to!==this.id)return;
        if(m.hello){const c=new BCConn(this.ch,this.id,m.from);this.conns[m.from]=c;this.emit("connection",c);setTimeout(()=>{c.emit("open");this.ch.postMessage({to:m.from,from:this.id,ack:true})},10);return}
        if(m.ack){const c=this.conns[m.from];c&&c.emit("open");return}
        const c=this.conns[m.from];c&&c.emit("data",m.d)};
      setTimeout(()=>this.emit("open",this.id),10)}
    on(e,f){(this.h[e]=this.h[e]||[]).push(f)} emit(e,x){(this.h[e]||[]).forEach(f=>f(x))}
    reconnect(){} destroy(){}
    connect(id){const c=new BCConn(this.ch,this.id,id);this.conns[id]=c;this.ch.postMessage({to:id,from:this.id,hello:true});return c}}
  return BCPeer;
}
const _qs=new URLSearchParams(location.search);
const TEST_BC=_qs.get("transport")==="bc";
async function makePeer(id){if(TEST_BC){const P=bcTransport();return new P(id)}await loadPeerJS();return id?new Peer(id,{debug:1}):new Peer({debug:1})}
const peerId=code=>"imukat-tk-"+code;
const RELAY_URLS=_qs.get("broker")?[_qs.get("broker")]:["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt"];
const NO_P2P=_qs.get("nop2p")==="1";
class MiniMQTT{
  constructor(url){this.url=url;this.h={};this.buf=new Uint8Array(0);this.pid=1;this.ok=false}
  on(e,f){this.h[e]=f}
  _emit(e,x){this.h[e]&&this.h[e](x)}
  static u8(s){return new TextEncoder().encode(s)}
  static str(s){const b=MiniMQTT.u8(s);const o=new Uint8Array(2+b.length);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o}
  static len(n){const o=[];do{let d=n%128;n=Math.floor(n/128);if(n)d|=128;o.push(d)}while(n);return o}
  static pkt(type,parts){const body=parts.reduce((a,p)=>a+p.length,0);const head=[type,...MiniMQTT.len(body)];const o=new Uint8Array(head.length+body);o.set(head,0);let i=head.length;for(const p of parts){o.set(p,i);i+=p.length}return o}
  connect(){return new Promise((res,rej)=>{
    let ws;try{ws=new WebSocket(this.url,"mqtt")}catch(e){return rej(e)}
    ws.binaryType="arraybuffer";this.ws=ws;
    const tm=setTimeout(()=>{try{ws.close()}catch(e){}rej(new Error("timeout"))},8000);
    ws.onopen=()=>{const id="im"+Math.random().toString(36).slice(2,12);
      ws.send(MiniMQTT.pkt(0x10,[MiniMQTT.str("MQTT"),new Uint8Array([4,2,0,60]),MiniMQTT.str(id)]))};
    ws.onmessage=ev=>{const d=new Uint8Array(ev.data);const nb=new Uint8Array(this.buf.length+d.length);nb.set(this.buf);nb.set(d,this.buf.length);this.buf=nb;
      while(this.buf.length>=2){let i=1,mul=1,rl=0,done=false;
        while(i<this.buf.length){const c=this.buf[i++];rl+=(c&127)*mul;mul*=128;if(!(c&128)){done=true;break}}
        if(!done||i+rl>this.buf.length)break;
        const t=this.buf[0]>>4,body=this.buf.slice(i,i+rl);this.buf=this.buf.slice(i+rl);
        if(t===2){clearTimeout(tm);if(body[1]===0){this.ok=true;this.ping=setInterval(()=>{try{ws.send(new Uint8Array([0xC0,0]))}catch(e){}},30000);res(this)}else rej(new Error("refused"))}
        else if(t===3){const tl=(body[0]<<8)|body[1];const topic=new TextDecoder().decode(body.slice(2,2+tl));const p=2+tl;
          this._emit("message",{topic,text:new TextDecoder().decode(body.slice(p))})}
      }};
    ws.onerror=()=>{clearTimeout(tm);if(!this.ok)rej(new Error("ws error"))};
    ws.onclose=()=>{clearTimeout(tm);clearInterval(this.ping);const was=this.ok;this.ok=false;if(was)this._emit("close");else rej(new Error("closed"))};
  })}
  subscribe(topic){const id=this.pid++;this.ws.send(MiniMQTT.pkt(0x82,[new Uint8Array([id>>8,id&255]),MiniMQTT.str(topic),new Uint8Array([0])]))}
  publish(topic,text){if(!this.ok)return false;this.ws.send(MiniMQTT.pkt(0x30,[MiniMQTT.str(topic),MiniMQTT.u8(text)]));return true}
  close(){try{this.ws.send(new Uint8Array([0xE0,0]));this.ws.close()}catch(e){}}
}
const relayTopic=(code,who)=>"imukat/v1/"+code+"/"+who;
class RelayConn{
  constructor(cli,topicOut){this.cli=cli;this.out=topicOut;this.h={};this.open=false;this.relay=true}
  on(e,f){(this.h[e]=this.h[e]||[]).push(f)}
  emit(e,x){(this.h[e]||[]).forEach(f=>f(x))}
  send(d){if(!this.cli.publish(this.out,JSON.stringify({k:"d",d})))throw new Error("中継が切れています")}
  close(){this.open=false;this.closed=true}
}
async function hostRelayListen(){
  S.relayConns=S.relayConns||{};
  for(const url of RELAY_URLS){
    try{
      const cli=new MiniMQTT(url);await cli.connect();
      cli.subscribe(relayTopic(S.code,"host"));
      cli.on("message",({text})=>{let m;try{m=JSON.parse(text)}catch(e){return}
        if(!m||!m.f)return;const key=url+"|"+m.f;
        if(m.k==="hello"){let c=S.relayConns[key];
          if(!c||c.closed){c=S.relayConns[key]=new RelayConn(cli,relayTopic(S.code,"g-"+m.f));
            c.on("data",x=>{const msg=joinPart(c,x);if(msg)hostOnData(c,msg)});c.open=true}
          cli.publish(relayTopic(S.code,"g-"+m.f),JSON.stringify({k:"ack"}));return}
        if(m.k==="d"){const c=S.relayConns[key];if(c)c.emit("data",m.d)}
      });
      cli.on("close",()=>{setTimeout(()=>{if(S.mode==="host")hostRelayListen()},5000)});
      (S.relayClis=S.relayClis||[]).push(cli);
    }catch(e){console.warn("中継サーバーに接続できません",url,e)}
  }
}
function guestRelayConnect(url){return new Promise(async(res,rej)=>{
  const me=(S.relayId=S.relayId||Math.random().toString(36).slice(2,10));
  let cli;try{cli=new MiniMQTT(url);await cli.connect()}catch(e){return rej(e)}
  const c=new RelayConn(cli,relayTopic(S.code,"host"));
  c.send=d=>{if(!cli.publish(relayTopic(S.code,"host"),JSON.stringify({k:"d",f:me,d})))throw new Error("中継が切れています")};
  c.close=()=>{c.closed=true;clearInterval(hi);cli.close()};
  cli.subscribe(relayTopic(S.code,"g-"+me));
  cli.on("message",({text})=>{let m;try{m=JSON.parse(text)}catch(e){return}
    if(m.k==="ack"&&!c.open){c.open=true;clearInterval(hi);c.emit("open");res(c)}
    else if(m.k==="d")c.emit("data",m.d)});
  cli.on("close",()=>{if(!c.closed)c.emit("close")});
  const hello=()=>cli.publish(relayTopic(S.code,"host"),JSON.stringify({k:"hello",f:me}));
  const hi=setInterval(hello,2000);setTimeout(hello,300);
  setTimeout(()=>{if(!c.open){clearInterval(hi);cli.close();rej(new Error("no host"))}},12000);
})}
/* 大きいメッセージは分割して送る（端末によっては1通16KBを超えると届かない） */
const PART_CHARS=4000;
function sendMsg(conn,obj){
  if(!conn||conn.open===false)return false;
  const s=JSON.stringify(obj);
  if(s.length<=PART_CHARS){conn.send(obj);return true}
  const id=(S.msgSeq=(S.msgSeq||0)+1);const n=Math.ceil(s.length/PART_CHARS);
  for(let i=0;i<n;i++)conn.send({t:"part",id,i,n,d:s.slice(i*PART_CHARS,(i+1)*PART_CHARS)});
  return true;
}
function joinPart(conn,msg){
  if(!msg||msg.t!=="part")return msg;
  const box=conn.__parts||(conn.__parts={});
  const b=box[msg.id]||(box[msg.id]={n:msg.n,got:0,d:[]});
  if(b.d[msg.i]==null){b.d[msg.i]=msg.d;b.got++}
  if(b.got<b.n)return null;
  delete box[msg.id];for(const k of Object.keys(box))if(+k<msg.id)delete box[k];
  try{return JSON.parse(b.d.join(""))}catch(e){console.error(e);return null}
}
function saveHost(){try{localStorage.setItem("imukat_host_"+S.code,JSON.stringify(S.game));localStorage.setItem("imukat_last_host",S.code)}catch(e){}}

/* ---------- 取り消し（部屋を作った人だけ）：操作のたびに直前の状態を保存しておく ---------- */
const HIST_MAX=80;
function pushHist(label){
  if(!S.game||S.mode==="guest")return;
  S.hist.push({label,snap:JSON.stringify(S.game)});
  if(S.hist.length>HIST_MAX)S.hist.shift();
}
function undoLast(){
  const h=S.hist.pop();if(!h)return "戻せる操作がありません";
  const cur=S.game;const ng=JSON.parse(h.snap);
  ng.players.forEach(p=>{const c=cur.players.find(q=>q.id===p.id);if(c){p.connected=c.connected;p.token=c.token}});
  ng.undos=(cur.undos||0)+1;ng.alog=cur.alog.concat([{at:Date.now(),round:ng.round,turn:ng.turn,stage:ng.stage||ng.phase,pid:"",name:"",role:"",kind:"取り消し",detail:h.label}]);
  ng.timerSig=null;
  for(const k of Object.keys(cur))delete cur[k];Object.assign(cur,ng);
  cur.log.push({r:cur.round,t:cur.turn,vis:"all",m:`部屋を作った人が「${h.label}」を取り消しました`});
  return null;
}
function actLabel(pid,a){const p=S.game&&E.P(S.game,pid);const n=p?p.name:"";
  const K={start:"ゲーム開始",nextRound:"次のラウンドへ",setupDet:"探偵の準備",declare:"予告状の選択",useItem:"アイテム",heli:"ヘリを呼ぶ",give:"譲渡",roll:"サイコロ",stay:"その場に留まる",dest:"移動先",confirm:"行動の確定",unconfirm:"確定の取り消し",skill:"スキル",act:"行動",endTurn:"ターン終了",proxy:"代わりに進める",timeout:"時間切れ"};
  return `${n?n+"：":""}${K[a&&a.kind]||a&&a.kind}${a&&a.kind==="useItem"?"（"+E.ITEMS[a.item].name+"）":""}${a&&a.kind==="skill"?"（"+E.SKILLS[a.id].name+"）":""}`}
function hostApply(pid,a,fn,label){
  const before=JSON.stringify(S.game);
  const err=E.safeApply(S.game,pid,a,fn);
  if(!err&&JSON.stringify(S.game)!==before){S.hist.push({label:label||actLabel(pid,a),snap:before});if(S.hist.length>HIST_MAX)S.hist.shift()}
  return err;
}
function broadcast(){
  if(!S.game)return;
  timerAttach();
  if(S.mode==="host"){
    for(const [pid,conn] of S.conns){try{sendMsg(conn,{t:"state",view:E.viewFor(S.game,pid),code:S.code,timer:S.timerOut})}catch(e){console.error(e)}}
    saveHost();
  }
  if(S.mode==="local")store.set("imukat_local",S.game);
  saveHistory();
  try{S.view=E.viewFor(S.game,S.seat);S.timer=S.timerOut;render()}catch(e){console.error(e);toast("画面の表示でエラー："+e.message)}
}
async function hostCreate(name,resumeCode){
  S.mode="host";S.code=resumeCode||makeCode();S.hist=[];
  if(resumeCode){S.game=JSON.parse(localStorage.getItem("imukat_host_"+resumeCode));S.game.players.forEach(p=>{if(p.id!=="P1")p.connected=false})}
  else{S.game=E.newGame();const p=E.newPlayer("P1",name);p.token="host";S.game.players.push(p)}
  S.seat="P1";
  renderMsg("部屋を作っています…");
  hostRelayListen();
  let peer;
  try{peer=await makePeer(peerId(S.code))}catch(e){toast("直接通信の準備ができませんでした（中継で待ち受けます）");broadcast();return}
  S.peer=peer;
  peer.on("open",()=>{broadcast()});
  setTimeout(()=>{if(!S.view)broadcast()},8000);
  peer.on("error",e=>{
    if(e.type==="unavailable-id"){toast("前の接続がまだ残っているため直接通信は使えません。中継で待ち受けます");broadcast()}
    else toast("通信エラー："+(e.type||e.message));
  });
  peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
  clearInterval(S.hb);S.hb=setInterval(()=>{for(const [,c] of S.conns){try{c.open!==false&&c.send({t:"hb"})}catch(e){}}},5000);
  if(!S.relayWatch)S.relayWatch=setInterval(()=>{if(S.mode==="host"&&!(S.relayClis||[]).some(c=>c.ok)){S.relayClis=[];hostRelayListen()}},30000);
  keepAwake();
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.mode==="host"){keepAwake();try{if(S.peer&&S.peer.disconnected)S.peer.reconnect()}catch(e){}broadcast()}});
  peer.on("connection",conn=>{
    conn.on("data",m=>{const msg=joinPart(conn,m);if(msg)hostOnData(conn,msg)});
    conn.on("close",()=>{for(const [pid,c] of S.conns)if(c===conn){S.conns.delete(pid);const p=E.P(S.game,pid);if(p){p.connected=false}broadcast()}});
  });
}
async function keepAwake(){try{if("wakeLock" in navigator&&document.visibilityState==="visible"&&!S.wake)S.wake=await navigator.wakeLock.request("screen"),S.wake.addEventListener("release",()=>{S.wake=null})}catch(e){}}
function hostOnData(conn,msg){
  const g=S.game;
  if(msg.t==="hb")return;
  if(msg.t==="sync"){let pid=null;for(const [k,c] of S.conns)if(c===conn)pid=k;if(pid)try{sendMsg(conn,{t:"state",view:E.viewFor(g,pid),code:S.code,timer:S.timerOut})}catch(e){}return}
  if(msg.t==="join"){
    let p=msg.token&&g.players.find(q=>q.token===msg.token);
    if(!p){
      if(g.phase!=="lobby"){conn.send({t:"err",msg:"ゲームはもう始まっています（前に参加した端末からなら、同じ名前で再参加できます）"});return}
      if(g.players.length>=6){conn.send({t:"err",msg:"満員です（最大6人）"});return}
      p=E.newPlayer("P"+(g.players.length+1),String(msg.name||"プレイヤー").slice(0,12));p.token=msg.token;g.players.push(p);
      toast(`${p.name}さんが参加しました`);
    }else toast(`${p.name}さんが再接続しました`);
    p.connected=true;S.conns.set(p.id,conn);
    conn.send({t:"welcome",pid:p.id,code:S.code});
    broadcast();return;
  }
  if(msg.t==="act"){
    let pid=null;for(const [k,c] of S.conns)if(c===conn)pid=k;
    if(!pid)return;
    if(msg.a&&["start","nextRound","opt"].includes(msg.a.kind)){conn.send({t:"err",msg:"この操作は部屋を作った人だけができます"});return}
    const err=hostApply(pid,msg.a);
    if(err)conn.send({t:"err",msg:err});
    broadcast();
  }
}
function getToken(code,name){const k="imukat_tok_"+code+"_"+name;let t=localStorage.getItem(k);if(!t){t=Math.random().toString(36).slice(2)+Date.now().toString(36);try{localStorage.setItem(k,t)}catch(e){}}return t}
const JOIN_STAGE={relay:"中継サーバー経由でつないでいます",lib:"通信の準備をしています",server:"通信サーバーにつないでいます",host:"部屋を作った人の端末につないでいます",join:"部屋に入っています"};
function joinMsg(stage,tries,sec){
  $("#app").innerHTML=`<h1>IMUKAT テスト版</h1><div class="panel">部屋に接続しています…<div class="sub" style="margin-top:6px">${esc(JOIN_STAGE[stage]||"")}（${sec}秒${tries>1?`・${tries}回目`:""}）</div>
  <div class="row" style="margin-top:10px"><button id="bjretry">もう一度試す</button><button onclick="location.href=location.pathname">タイトルに戻る</button></div></div>`;
  const b=$("#bjretry");if(b)b.onclick=()=>guestJoin(S.code,S.myName,1);
}
function joinFail(stage){
  const why={lib:"通信の準備ができませんでした（電波が弱いか、通信が制限されています）。",server:"通信サーバーにつながりませんでした（電波が弱いか、通信が制限されています）。",
    host:"部屋を作った人の端末とつながりませんでした。作った人の画面が閉じている・スリープしている、または回線の組み合わせによってはつながらないことがあります。",
    join:"部屋に入れませんでした。",relay:"中継サーバー経由でもつながりませんでした。部屋を作った人の画面が閉じている・スリープしている可能性があります。"}[stage]||"";
  $("#app").innerHTML=`<h1>IMUKAT テスト版</h1><div class="panel warn"><b>接続できませんでした</b><div class="sub" style="margin-top:6px">${esc(why)}</div>
  <div class="sub" style="margin-top:6px">試すこと：<br>① Wi-Fiとモバイルデータを切り替える<br>② 部屋を作った人に、ゲーム画面を開いたままにしてもらう<br>③ 別のブラウザ（Chrome／Safari）で開き直す<br>つながらない間は、部屋を作った人が「代わりに進める」でゲームを進められます。</div>
  <div class="row" style="margin-top:10px"><button class="primary" id="bjretry">もう一度試す</button><button onclick="location.href=location.pathname">タイトルに戻る</button></div></div>`;
  $("#bjretry").onclick=()=>guestJoin(S.code,S.myName,1);
}
async function guestJoin(code,name,tries){
  tries=tries||1;
  S.mode="guest";S.code=code.toUpperCase();S.myName=name;S.view=null;
  clearInterval(S.joinTimer);clearInterval(S.watch);
  try{S.hostConn&&S.hostConn.relay&&S.hostConn.close()}catch(e){}
  try{S.peer&&S.peer.destroy&&S.peer.destroy()}catch(e){}
  let prefRelay=false;try{prefRelay=localStorage.getItem("imukat_relay_"+S.code)==="1"}catch(e){}
  const useRelay=NO_P2P||prefRelay||tries>=2;
  const relayUrl=RELAY_URLS[Math.max(0,(prefRelay||NO_P2P?tries-1:tries-2))%RELAY_URLS.length];
  S.via=useRelay?"relay":"p2p";
  S.joinStage=useRelay?"relay":"lib";const t0=Date.now();
  const maxTries=useRelay&&tries===1?2:3;
  const retry=()=>{clearInterval(S.joinTimer);if(S.view)return;if(tries<maxTries)guestJoin(S.code,name,tries+1);else joinFail(S.joinStage)};
  joinMsg(S.joinStage,tries,0);
  S.joinTimer=setInterval(()=>{if(S.view){clearInterval(S.joinTimer);return}const sec=Math.round((Date.now()-t0)/1000);
    if(sec>=(useRelay?20:15))retry();else joinMsg(S.joinStage,tries,sec)},1000);
  const onData=(conn,m)=>{
    S.lastMsg=Date.now();if(S.stale){S.stale=false;render()}
    const msg=joinPart(conn,m);if(!msg)return;
    if(msg.t==="hb")return;
    if(msg.t==="welcome"){S.seat=msg.pid;try{localStorage.setItem("imukat_last_guest",JSON.stringify({code:S.code,name}));localStorage.setItem("imukat_relay_"+S.code,conn.relay?"1":"0")}catch(e){}}
    else if(msg.t==="state"){S.view=msg.view;S.timer=msg.timer?Object.assign({},msg.timer,{recv:Date.now()}):null;clearInterval(S.joinTimer);render()}
    else if(msg.t==="err"){toast(msg.msg);if(!S.view){clearInterval(S.joinTimer);renderMsg(msg.msg,true)}}
  };
  const wire=conn=>{
    S.hostConn=conn;
    conn.on("data",m=>onData(conn,m));
    conn.on("close",()=>{if(conn!==S.hostConn)return;if(!S.view)return;toast("接続が切れました。つなぎ直しています");S.reconnect&&S.reconnect()});
  };
  const sendJoin=conn=>{if(!S.view)S.joinStage="join";conn.send({t:"join",name,token:getToken(S.code,name)})};
  let connect;
  if(useRelay){
    connect=async()=>{try{const c=await guestRelayConnect(relayUrl);if(S.via!=="relay")return c.close();wire(c);sendJoin(c)}catch(e){if(!S.view)retry()}};
  }else{
    let peer;try{peer=await makePeer()}catch(e){clearInterval(S.joinTimer);return guestJoin(S.code,name,tries+1)}
    if(S.view)return;
    S.peer=peer;S.joinStage="server";
    connect=()=>{
      const conn=peer.connect(peerId(S.code),{reliable:true,serialization:"json"});
      S.joinStage=S.view?S.joinStage:"host";wire(conn);
      conn.on("open",()=>sendJoin(conn));
    };
    peer.on("open",connect);
    peer.on("error",e=>{if(!S.view)return retry();toast("通信エラー："+(e.type||e.message))});
    peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
  }
  if(useRelay)connect();
  S.reconnect=()=>{
    if(S.via==="relay"){const old=S.hostConn;S.hostConn=null;try{old&&old.close()}catch(e){}connect();return}
    const peer=S.peer;if(!peer||peer.destroyed){guestJoin(S.code,name,1);return}
    const old=S.hostConn;S.hostConn=null;try{old&&old.close&&old.close()}catch(e){}try{if(peer.disconnected)peer.reconnect()}catch(e){}connect()};
  S.lastMsg=Date.now();
  S.watch=setInterval(()=>{if(!S.view)return;const gap=Date.now()-S.lastMsg;
    if(gap>15000&&!S.stale){S.stale=true;render()}
    if(gap>20000&&Date.now()-(S.lastTry||0)>20000){S.lastTry=Date.now();S.reconnect()}
    if(gap>60000&&Date.now()-(S.lastFull||0)>60000){S.lastFull=Date.now();guestJoin(S.code,name,S.via==="relay"?2:1)}
  },5000);
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.mode==="guest"&&S.view&&Date.now()-(S.lastMsg||0)>8000&&S.reconnect)S.reconnect()});

/* ---------- 制限時間（部屋を作った人と1台モードの画面で管理） ---------- */
function timerSig(g){if(g.phase!=="play")return null;return [g.round,g.turn,g.stage,g.step].join("|")}
function timerSec(g){if(g.phase!=="play")return 0;if(g.stage==="thief"&&g.opt.thiefTimer)return g.opt.thiefSec;if(g.stage==="det"&&g.opt.detTimer)return g.opt.detSec;return 0}
function timerAttach(){
  const g=S.game;if(!g)return;const sig=timerSig(g);
  if(sig!==g.timerSig){g.timerSig=sig;g.timerStart=Date.now()}
  const sec=timerSec(g);
  S.timerOut=sec&&sig?{end:g.timerStart+sec*1000,sec,sent:Date.now()}:null;
}
setInterval(()=>{
  const g=S.game;if(!g||(S.mode!=="host"&&S.mode!=="local"))return;
  const sec=timerSec(g);if(!sec||g.timerSig!==timerSig(g))return;
  if(Date.now()<g.timerStart+sec*1000)return;
  const ids=E.pendingIds(g);if(!ids.length)return;
  const label=g.stage==="thief"?"時間切れ（怪盗のターン）":"時間切れ（探偵のターン）";
  const before=JSON.stringify(g);
  for(const id of ids){E.safeApply(g,id,null,()=>E.proxyAct(g,id))}
  g.alog.push({at:Date.now(),round:g.round,turn:g.turn,stage:g.stage,pid:"",name:"",role:"",kind:"時間切れ",detail:ids.map(id=>E.P(g,id).name).join("・")});
  S.hist.push({label,snap:before});if(S.hist.length>HIST_MAX)S.hist.shift();
  toast(label);broadcast();
},1000);
setInterval(()=>{const el=document.getElementById("timerbadge");if(!el||!S.timer)return;
  const ms=S.timer.recv?(S.timer.end-S.timer.sent)-(Date.now()-S.timer.recv):S.timer.end-Date.now();
  const left=Math.max(0,Math.ceil(ms/1000));el.textContent=`⏱ 残り${left}秒`;el.classList.toggle("warn",left<=10)},400);

/* ---------- これまでのテスト記録（この端末に保存） ---------- */

  const g=S.game;if(!g||!g.records||!g.records.length)return;

}

/* ---------- 結果のポップアップ ---------- */
function seenKey(){return `imukat_seen_${S.code||""}_${V()&&V().gid||""}_${V()&&V().me||""}`}
function seenSet(){const k=seenKey();S._seen=S._seen||{};if(!S._seen[k]){let a=[];try{a=JSON.parse(localStorage.getItem(k)||"[]")}catch(e){}S._seen[k]=new Set(a)}return S._seen[k]}
function markSeen(ids){const k=seenKey();const st=seenSet();ids.forEach(i=>st.add(i));try{localStorage.setItem(k,JSON.stringify([...st].slice(-200)))}catch(e){}}
function showNotes(){
  const v=V();let box=document.getElementById("notebox");
  if(!v||!v.notes||!(v.phase==="play"||v.phase==="roundEnd")){if(box)box.remove();return}
  const st=seenSet();const fresh=v.notes.filter(n=>!st.has(n.id));
  if(!fresh.length){if(box)box.remove();return}
  if(!box){box=document.createElement("div");box.id="notebox";document.body.appendChild(box)}
  const allIds=fresh.map(n=>n.id);
  const show=fresh.slice(-6);const sig=show.map(n=>n.id).join(",");
  if(box.dataset.sig===sig)return;box.dataset.sig=sig;
  box.innerHTML=`<div class="nwrap" role="alertdialog" aria-label="行動の結果">${show.map(n=>`<div class="ncard ${n.tone}"><div class="nt"><span class="ni">${n.icon}</span><span>${esc(n.title)}</span></div>${n.lines.length?`<ul>${n.lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`:""}<div class="nm">${n.t}ターン目</div></div>`).join("")}<button class="primary nok" id="bnoteok">OK</button></div>`;
  const close=()=>{markSeen(allIds);box.remove()};
  document.getElementById("bnoteok").onclick=close;
  box.onclick=e=>{if(e.target===box)close()};
}

function render(){
  const v=V();if(!v){renderTitle();return}
  let h=`<div class="row"><h1 class="grow">IMUKAT <span class="sub">${esc(VERSION)}</span></h1><span class="sub">${S.mode==="local"?"1台モード":"部屋 "+esc(S.code)}</span></div>`;
  if(S.mode==="local"){
    const pend=v.pending||[];
    h+=`<div class="tabs">${S.game.players.map(p=>`<button class="${p.id===S.seat?"on primary":""}" data-seat="${p.id}">${esc(p.name)}${p.det?"🕵":""}${pend.includes(p.id)?" ●":""}</button>`).join("")}</div><div class="sub">● は操作待ちの人。切り替えると、その人の画面（その人に見える情報だけ）になります。</div>`;
  }
  if(S.stale)h+=`<div class="panel warn"><b>部屋を作った人の画面と通信できていません。</b><div class="sub">作った人の画面が閉じている・スリープしている可能性があります。自動で再接続を試しています。</div><div class="row" style="margin-top:6px"><button class="primary" id="brecon">今すぐ再接続</button></div></div>`;
  if(v.phase!=="lobby")h+=headerHTML(v);
  if(S.timer&&v.phase==="play")h+=`<div class="timerbar"><span id="timerbadge">⏱</span><small class="sub">${v.stage==="thief"?"怪盗":"探偵"}のターンの制限時間 ${S.timer.sec}秒（時間切れになると、まだの人はその場に留まって何もしません）</small></div>`;
  if(isHost()&&v.phase!=="lobby")h+=hostMenuHTML(v);
  if(v.phase==="lobby")h+=renderLobby(v);
  else if(v.phase==="setup")h+=renderSetup(v);
  else if(v.phase==="play")h+=renderPlay(v);
  else if(v.phase==="roundEnd")h+=renderRoundEnd(v);
  else if(v.phase==="end")h+=renderEnd(v);
  $("#app").innerHTML=h;
  renderSide(v);
  bind();
  try{showNotes()}catch(e){console.error(e)}
}
function headerHTML(v){
  const me=pl(v.me);
  const role=v.role==="det"?"🕵 探偵":v.role==="thief"?"🎩 怪盗":"";
  const stage=v.phase==="play"?(v.stage==="thief"?"怪盗のターン":`探偵のターン（${v.step}回目）`):v.phase==="setup"?"準備":v.phase==="roundEnd"?"ラウンド終了":"ゲーム終了";
  return `<div class="panel"><div class="row"><b class="grow">第${v.round}/${v.rounds}ラウンド ${v.phase==="play"?`・${v.turn}/${v.opt.turns}ターン`:""}・${esc(stage)}</b><span class="pill">${esc(v.building)}</span></div>
  <div class="row sub" style="margin-top:4px">あなた：${me?chip(me.id):""} ${role} ／ 所持金 ${yen(me?me.money:0)}${me&&me.debt?`（借金 ${yen(me.debt)}）`:""} ／ 探偵：${chip(v.detId)}</div>
  <div class="row sub" style="margin-top:4px;gap:2px 10px">💰 ${v.players.map(p=>`${chip(p.id)} ${yen(p.money-p.debt)}`).join(" ")}</div>
  <div class="row" style="margin-top:4px;gap:4px 10px">${v.players.filter(p=>p.role==="thief").map(p=>`<span class="sub">${chip(p.id)} ${{active:"",captured:"⛓捕縛中",escaped:"🏁脱出",failed:"✖失敗"}[p.status]||""}${p.heliCall!=null?` 🚁${p.heliCall+2}〜${p.heliCall+3}T`:""}${p.declared?" 📜":""}</span>`).join("")}</div>
  ${v.backOpen?`<div class="sub ng" style="margin-top:4px">🚪 裏口が開いています（変装していれば裏口からも脱出できます）</div>`:""}</div>`;
}
function hostMenuHTML(v){
  const pend=(v.pending||[]).filter(id=>id!==S.seat||S.mode==="host");
  const errN=v.errorsN||0;
  const last=S.hist[S.hist.length-1];
  return `<details class="panel"${errN?' open style="border-color:var(--warn)"':""}><summary class="sub">${S.mode==="local"?"1台モードのメニュー":"部屋を作った人のメニュー"}${errN?`（内部エラー ${errN}件）`:""}${pend.length?`・待っている人 ${pend.length}人`:""}</summary>
    ${S.mode==="host"?`<div class="sub">この画面がゲームの親です。スリープ・別アプリへの切り替え・タブを閉じると、全員の画面が止まります。止まったら、この画面を開き直してください（再読み込みした場合はタイトル画面の「前回の部屋を再開」）。</div>`:""}
    <div class="row" style="margin-top:6px"><button id="bundo" ${last?"":"disabled"}>⏪ 1つ前の操作に戻す${last?`<small>「${esc(last.label)}」を取り消す</small>`:"<small>戻せる操作がありません</small>"}</button></div>
    ${pend.length?`<div class="sub" style="margin-top:6px">スリープなどで進まない人の代わりに進めます（怪盗はその場に留まって何もしない、探偵はターンを終える、準備はおまかせ）。</div><div class="row" style="margin-top:4px">${pend.map(id=>`<button data-proxy="${id}">${esc(pname(id))}の代わりに進める</button>`).join("")}</div>`:""}
  </details>`;
}
function renderLobby(v){
  const url=location.origin+location.pathname+"?room="+S.code;
  const g=S.game;const o=v.opt;const can=isHost();
  let h=`<div class="panel"><h2 style="margin-top:0">参加者を待っています</h2>`;
  if(S.mode==="host")h+=`<div>部屋番号 <span class="big">${esc(S.code)}</span></div><div class="sub">友達にはこのリンクを送ってください</div><div class="row"><input readonly value="${esc(url)}" class="grow" id="shareurl"><button id="bcopy">コピー</button></div>`;
  h+=`<ul>${v.players.map(p=>`<li>${chip(p.id)}${p.id===v.me?"（あなた）":""}${p.connected?"":" <span class='pill'>切断中</span>"}</li>`).join("")}</ul>`;
  h+=`<h2>テストの設定${can?"":"（部屋を作った人が決めます）"}</h2>
  <table>
  <tr><td>怪盗のターンの制限時間</td><td><label><input type="checkbox" id="o_tt" ${o.thiefTimer?"checked":""} ${can?"":"disabled"}> あり</label> <input type="number" id="o_ts" min="10" max="300" step="5" value="${o.thiefSec}" style="width:80px" ${can?"":"disabled"}>秒</td></tr>
  <tr><td>探偵のターンの制限時間</td><td><label><input type="checkbox" id="o_dt" ${o.detTimer?"checked":""} ${can?"":"disabled"}> あり</label> <input type="number" id="o_ds" min="10" max="300" step="5" value="${o.detSec}" style="width:80px" ${can?"":"disabled"}>秒</td></tr>
  <tr><td>アイテム（仮）</td><td><label><input type="checkbox" id="o_it" ${o.items?"checked":""} ${can?"":"disabled"}> 使う</label></td></tr>
  <tr><td>探偵スキル（仮）</td><td><label><input type="checkbox" id="o_sk" ${o.skills?"checked":""} ${can?"":"disabled"}> 使う</label></td></tr>
  <tr><td>捕縛の判定</td><td><select id="o_cap" ${can?"":"disabled"}><option value="land" ${o.capture==="land"?"selected":""}>止まったマス</option><option value="near2" ${o.capture==="near2"?"selected":""}>2マス以内の捜査宣言</option></select></td></tr>
  <tr><td>変装に必要なパーツ</td><td><select id="o_pn" ${can?"":"disabled"}>${[2,3,4].map(n=>`<option ${o.partsNeed===n?"selected":""}>${n}</option>`).join("")}</select>種類</td></tr>
  <tr><td>1ラウンドのターン数</td><td><input type="number" id="o_turns" min="4" max="20" value="${o.turns}" style="width:80px" ${can?"":"disabled"}></td></tr>
  <tr><td>ラウンド数</td><td><select id="o_rounds" ${can?"":"disabled"}><option value="">人数と同じ（全員1回探偵）</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${o.rounds===n?"selected":""}>${n}ラウンド</option>`).join("")}</select></td></tr>
  </table>`;
  if(can)h+=`<div class="row" style="margin-top:10px"><button class="primary" id="bstart" ${v.players.length<2?"disabled":""}>この${v.players.length}人で始める</button></div><div class="sub">本番は4〜6人想定です（テスト用に2人から始められます）。1ラウンド目の探偵は、参加した順の1番目の人です。</div>`;
  else h+=`<div class="sub">部屋を作った人が開始するまでお待ちください。</div>`;
  return h+`</div>`;
}

/* ---------- マップ ---------- */
function reachV(v,from,n){return E.reach({building:v.bid,blocks:(v.blocks||[]).map(i=>({i,until:1e9})),turn:0},from,n)}
function mapHTML(v,o){
  o=o||{};const b=E.bld({building:v.bid});
  const fixed={};fixed[b.front]="正";fixed[b.back]="裏";b.stairs.forEach((p,i)=>p.forEach(k=>fixed[k]=(v.blocks||[]).includes(i)?"⛔":"階"));b.roof.forEach(k=>fixed[k]="屋");b.windows.forEach(k=>fixed[k]="窓");
  const sel=new Set(o.sel||[]);const tap=o.tap||new Set();
  const myRole=v.role, all=!!v.revealAll;
  const lastRev=(v.reveals||[]).filter(r=>r.r===v.round&&r.t>=v.turn-1&&r.k!=null);
  const floorHTML=f=>{
    let c="";
    for(let r=0;r<8;r++)for(let cc=0;cc<8;cc++){
      const k=E.K(f,r,cc);const q=((r>=4)+(cc>=4))%2;
      const cls=["cell"];if(q)cls.push("q1");if(fixed[k])cls.push("fx");if(tap.has&&tap.has(k))cls.push("reach","tap");if(sel.has(k))cls.push("sel");if(o.anyTap)cls.push("tap");
      let in_="";
      if(fixed[k])in_+=`<span class="fxl">${fixed[k]}</span>`;
      const tr=v.tr.find(t=>t.k===k&&!t.taken);if(tr){const gone=tr.seen&&tr.seen.taken;in_+=`<span class="tr ${tr.alarm&&!gone?"alarm":""} ${gone?"gone":""}" title="${esc(tr.name)}">${gone?"✕":E.TR[tr.rank].label[0]}</span>`;if(tr.seen&&!gone)in_+=`<span class="seen">${tr.seen.stage}/${tr.seen.need}</span>`}
      const pt=v.parts.find(x=>x.k===k&&!x.taken);if(pt){const gone=pt.seen&&pt.seen.taken;in_+=`<span class="pt ${gone?"gone":""}">${{uniform:"服",mask:"面",badge:"証",baton:"棒"}[pt.type]}</span>`}
      const fps=(v.prints||[]).filter(x=>x.k===k);if(fps.length)in_+=`<span class="fp">${fps.map(x=>`<i class="${x.age?"old":""} ${x.fake?"fake":""}" style="--pc:${pcol(x.pid)}"></i>`).join("")}</span>`;
      const capd=v.players.filter(p=>p.capK===k);
      if(v.thieves){const here=v.thieves.filter(t=>t.k===k&&(t.status==="active"||t.status==="captured"));
        here.forEach((t,i)=>{in_+=`<span class="tk ${here.length>1?"two":""} ${t.status==="captured"?"cap":""}" style="--pc:${pcol(t.id)};${here.length>1?`left:${i%2?50:4}%;top:${i>1?50:4}%`:""}">${esc(pname(t.id).slice(0,1))}</span>`});
        v.thieves.filter(t=>t.tp&&t.tp.dest===k&&t.k!==k&&t.status==="active").forEach(t=>in_+=`<span class="plan" style="--pc:${pcol(t.id)}"></span>`);
      }else capd.forEach(p=>in_+=`<span class="tk cap" style="--pc:${pcol(p.id)}">⛓</span>`);
      if(v.det&&v.det.k===k)in_+=`<span class="dt">🕵</span>`;
      if(v.det&&v.det.tp&&v.det.tp.dest===k&&v.det.k!==k)in_+=`<span class="plan" style="--pc:#333"></span>`;
      if(v.det&&(v.det.devices||[]).includes(k))in_+=`<span class="mk">🔔</span>`;
      if((v.oils||[]).some(x=>x.k===k))in_+=`<span class="mk">💧</span>`;
      if(myRole!=="det"&&lastRev.some(r=>r.k===k))in_+=`<span class="rv" title="探偵がいた"></span>`;
      if((v.searchMarks||[]).some(m=>m.k===k))in_+=`<span class="mk">🔍</span>`;
      if(b.roof.includes(k)&&v.players.some(p=>p.heliCall!=null&&v.turn>=p.heliCall+2&&v.turn<=p.heliCall+3&&p.status==="active"))in_+=`<span class="mk">🚁</span>`;
      in_+=`<span class="co">${E.nm(k).replace("-","")}</span>`;
      c+=`<button class="${cls.join(" ")}" data-k="${k}">${in_}</button>`;
    }
    return `<div class="floorwrap"><div class="floorttl"><span>${f+1}階（${f?"E F / G H":"A B / C D"}）</span><span class="sub">${f?"屋＝屋上階段・窓＝窓":"正＝正面ゲート・裏＝裏口"}・階＝階段</span></div><div class="board">${c}</div></div>`;
  };
  const floors=o.floors||[0,1];
  return floors.map(floorHTML).join("")+`<div class="legend"><span>高/普/安＝財宝</span><span style="color:var(--part)">服面証棒＝変装パーツ</span><span>●＝足跡（薄いのは2ターン前）</span>${myRole==="det"||all?"<span>🕵＝探偵</span>":""}${myRole==="det"?"<span>✕・薄い字＝調べたらなくなっていた／数字＝調べたときの解除段階（探偵は止まったマスの財宝・変装パーツだけ状況が分かります）</span>":""}${myRole!=="det"?"<span>赤枠＝探偵がいた場所</span>":""}<span>⛓＝捕縛中</span><span>点線の丸＝移動予定</span></div>`;
}

/* ---------- 準備 ---------- */
function renderSetup(v){
  let h="";
  const pend=v.pending||[];
  if(v.role==="det"){
    if(!v.det.ready){
      const sel=S.ui.skills||[];const st=S.ui.start;
      h+=`<div class="panel me"><b>🕵 探偵の準備</b><div class="sub">2階のマップでスタート地点を選んでください（何もないマスだけ選べます。財宝・変装パーツ・階段・窓・屋上階段のマスは選べません）${v.opt.skills?"。スキルを4つ選んでください（右の🔍からも説明を見られます）":""}。</div>`;
      if(v.opt.skills)h+=`<div class="acts">${Object.entries(E.SKILLS).map(([id,s])=>`<button data-skpick="${id}" class="${sel.includes(id)?"on primary":""}"><b>${esc(s.name)}</b><small>${s.ct?`使ったあと${s.ct}ターン休み`:"1財宝1回"}</small></button>`).join("")}</div><div class="sub">選んだスキル：${sel.length}/4</div>`;
      h+=`<div class="sub" style="margin-top:6px">スタート地点：<b>${st!=null?E.nm(st):"未選択"}</b></div>`;
      h+=`<div class="row" style="margin-top:6px"><button class="primary" id="bsetdet" ${st!=null&&(!v.opt.skills||sel.length===4)?"":"disabled"}>準備完了</button><button id="bsetrand">おまかせで選ぶ</button></div></div>`;
      h+=mapHTML(v,{floors:[1],tap:new Set(detStartSquares(v)),sel:st!=null?[st]:[]});
    }else h+=`<div class="panel">準備完了。怪盗が予告状を決めるのを待っています。</div>`;
  }else if(v.role==="thief"){
    const n=E.NOTICES[v.my.notice];
    if(v.my.declared==null){
      const b0=E.bld({building:v.bid});const ts=S.ui.tstart;
      h+=`<div class="panel me"><b>🚪 スタート地点</b><div class="sub">裏口（A-2）・正面ゲート（D-13）・2階の窓（F-4・G-13）から1つ選んでください。仲間の選んだ場所は共有マップで見えますが、探偵には分かりません。1ターン目は足跡が残りません。</div>
      <div class="row" style="margin-top:6px">${b0.starts.map(k=>`<button data-tstart="${k}" class="${ts===k?"on primary":""}">${{[b0.back]:"裏口",[b0.front]:"正面ゲート"}[k]||"窓"} ${E.nm(k)}</button>`).join("")}</div></div>
      <div class="panel me"><b>📜 あなたの予告状</b><div class="card notice"><b>${esc(n.name)}</b><div>${esc(n.text)}</div></div>
      <div class="sub">予告すると全員に公開され、達成して財宝を持って脱出すれば ${yen(E.MONEY.noticeOpen)}。予告しなければ伏せたままで、達成すれば ${yen(E.MONEY.noticeHidden)}。予告した怪盗が達成できなければ、探偵に ${yen(E.MONEY.block)}。<br>全員が決めたら同時に公開されます。</div>
      <div class="row" style="margin-top:8px"><button class="primary" id="bdecY" ${S.ui.tstart!=null?"":"disabled"}>予告する</button><button id="bdecN" ${S.ui.tstart!=null?"":"disabled"}>予告しない</button></div>${S.ui.tstart!=null?"":`<div class="sub">先にスタート地点を選んでください</div>`}</div>`;
    }else h+=`<div class="panel">スタート地点を ${E.nm(v.my.k)}、予告状を${v.my.declared?"「予告する」":"「予告しない」"}に決めました。ほかの人を待っています。</div>`;
    if(v.my.items.length)h+=`<div class="panel"><b>🃏 このラウンドのアイテム</b><div class="sub">${v.my.items.map(i=>esc(E.ITEMS[i].name)).join("・")}（右の🃏で効果を見られます）</div></div>`;
    h+=mapHTML(v,v.my.declared==null?{tap:new Set(E.bld({building:v.bid}).starts),sel:S.ui.tstart!=null?[S.ui.tstart]:[]}:{});
  }
  h+=`<div class="sub">待っている人：${pend.map(chip).join(" ")||"なし"}</div>`;
  return h;
}

/* ---------- ゲーム中 ---------- */
function renderPlay(v){
  let h="";
  if(v.role==="thief")h+=thiefPanel(v);
  else if(v.role==="det")h+=detPanel(v);
  h+=mapHTML(v,S.ui.mapOpt||{});
  h+=`<div class="panel"><b>最近の出来事</b><div class="log">${v.log.slice(-12).reverse().map(l=>`<div><span class="sub">R${l.r}-${l.t}T</span> ${esc(l.m)}</div>`).join("")}</div></div>`;
  return h;
}
function myThief(v){return (v.thieves||[]).find(t=>t.id===v.me)}
function partsHTML(parts,need,small){
  const n=E.PART_KEYS.filter(t=>(parts[t]||0)>0).length;
  return `<div class="parts" ${small?'style="margin-top:2px"':""}>${E.PART_KEYS.map(t=>{const c=parts[t]||0;return `<span class="partchip ${c>0?"on":""} ${c>1?"dup":""}" data-n=" ×${c}">${esc(E.PARTS[t])}</span>`}).join("")}${!small&&n>=need?`<span class="sub ok" style="align-self:center">✅ 変装できます</span>`:""}</div>`;
}
function thiefPanel(v){
  const me=myThief(v);const my=v.my;const tp=my.tp;
  S.ui.mapOpt={};
  let h=`<div class="panel me">`;
  const partsN=E.PART_KEYS.filter(t=>(me.parts[t]||0)>0).length;
  h+=`<div class="stat"><div>現在地 <b>${E.nm(me.k)}</b></div><div>財宝 <b>${me.loot.length?me.loot.map(id=>esc(v.tr.find(t=>t.id===id).name)).join("・"):"なし"}</b></div><div>変装パーツ <b>${partsN}/${v.opt.partsNeed}</b>${partsN>=v.opt.partsNeed?" ✅":""}</div><div>ヘリ <b>${me.heliCall==null?"未使用":`${me.heliCall+2}〜${me.heliCall+3}ターン目`}</b></div></div>${partsHTML(me.parts,v.opt.partsNeed)}${my.safe?`<div class="sub ok" style="margin-top:6px">🛡 抜け出したばかり：このターンは、${E.nm(me.k)} にいる限り探偵と同じマスでも捕まりません（動くと通常どおり）</div>`:""}`;
  if(v.stage!=="thief"){h+=`<div style="margin-top:8px">探偵のターンです。待っています…</div></div>`;return h+teamHTML(v)}
  if(me.status==="escaped"){h+=`<div style="margin-top:8px">🏁 脱出しました。ラウンドの終わりを待っています。</div></div>`;return h}
  if(me.status==="captured"){
    h+=`<div style="margin-top:8px">⛓ 捕縛されています。仲間がこのマスで解放作業をすると抜け出せます（${pl(v.me).rel||0}/${pl(v.me).relNeed}）。</div>`;
    const rp=my.items.includes("rope");
    if(rp||(tp&&!tp.done))h+=`<div class="row" style="margin-top:6px">${rp?`<button class="primary" data-use="rope">🪢 縄抜けを使う</button>`:""}${tp&&!tp.done?`<button id="bconf">このターンは待つ</button>`:""}</div>`;
    return h+`</div>`+teamHTML(v);
  }
  if(!tp){return h+`</div>`}
  if(tp.done){h+=`<div style="margin-top:8px">✅ 行動を確定しました（${E.nm(tp.dest)}・${actName(tp.act)}）。ほかの怪盗を待っています。</div><div class="row" style="margin-top:6px"><button id="bunconf">確定を取り消す</button></div></div>`;return h+teamHTML(v)}
  // 準備：アイテムの対象選択中
  if(S.ui.itemTarget){h+=`<div style="margin-top:8px"><b>「${esc(E.ITEMS[S.ui.itemTarget].name)}」を置くマスをマップで選んでください</b></div><div class="row"><button id="bitemcancel">やめる</button></div></div>`;S.ui.mapOpt={anyTap:true};return h}
  const free=[];
  if(me.heliCall==null)free.push(`<button id="bheli">🚁 ヘリを呼ぶ<small>${v.turn+2}ターン目の始めに到着</small></button>`);
  const mates=v.thieves.filter(t=>t.id!==me.id&&t.status==="active"&&t.k===me.k);
  if(mates.length)free.push(`<button id="bgive">🤝 仲間に渡す<small>同じマスにいる仲間</small></button>`);
  if(tp.roll==null&&!tp.stay){
    h+=`<div class="row" style="margin-top:8px"><button class="primary grow" id="broll">🎲 サイコロを振る${tp.use&&tp.use.shoes?"<small>俊足シューズ+2</small>":""}</button><button class="grow" id="bstay">その場に留まる</button></div>`;
  }else if(tp.dest==null){
    h+=`<div style="margin-top:8px"><b>出目 ${tp.roll}${tp.use&&tp.use.shoes?"（+2込み）":""}：移動先をマップで選んでください</b><div class="sub">光っているマスに止まれます（出た目以内ならどこでも・今いるマスも可）</div></div>`;
    S.ui.mapOpt={tap:new Set(reachV(v,me.k,tp.roll))};
  }else{
    const opts=my.options||["none"];
    if(!S.ui.act||!opts.includes(S.ui.act))S.ui.act=opts.includes("unlock")?"unlock":opts.includes("release")?"release":opts.includes("wire")?"wire":"none";
    const pt=v.parts.find(x=>x.k===tp.dest&&!x.taken);
    h+=`<div style="margin-top:8px"><b>移動先：${E.nm(tp.dest)}</b> ${tp.stay?"（留まる）":`<button id="bredest" style="min-height:32px;padding:2px 10px">選び直す</button>`}</div>
    <div class="acts">${opts.map(o=>`<button data-act="${o}" class="${S.ui.act===o?"on primary":""}">${actName(o)}${o==="unlock"?`<small>${unlockHint(v,tp.dest)}</small>`:""}</button>`).join("")}</div>
    ${pt?`<label class="row" style="margin-top:6px"><input type="checkbox" id="cpick" ${S.ui.pick!==false?"checked":""}> 変装パーツ「${esc(E.PARTS[pt.type])}」を拾う</label>`:""}
    ${exitHint(v,me,tp.dest)}
    <div class="row" style="margin-top:8px"><button class="primary grow" id="bconf">✅ この行動で確定</button></div>`;
    S.ui.mapOpt={sel:[tp.dest],tap:tp.stay?new Set():new Set(reachV(v,me.k,tp.roll))};
  }
  if(free.length)h+=`<div class="row" style="margin-top:8px">${free.join("")}</div>`;
  h+=`<div class="sub" style="margin-top:6px">アイテムは右の🃏から使えます。予告状は📜で確認できます。</div></div>`;
  return h+teamHTML(v);
}
function actName(a){return {unlock:"🔓 セキュリティ解除",release:"🔑 仲間の解放作業",receive:"💰 仲間から財宝を受け取る",wire:"🪝 ワイヤー銃で脱出",none:"何もしない"}[a]||a}
function unlockHint(v,k){const t=v.tr.find(x=>x.k===k&&!x.taken);if(!t)return "";return `${esc(t.name)}：${t.target}以上で成功・${t.stage}/${t.need}段階・失敗${t.fails}回`}
function exitHint(v,me,k){
  const b=E.bld({building:v.bid});const parts=E.PART_KEYS.filter(t=>(me.parts[t]||0)>0).length;
  if(b.roof.includes(k))return me.heliCall!=null&&v.turn>=me.heliCall+2&&v.turn<=me.heliCall+3?`<div class="sub ok">🚁 自分のヘリが待機中。止まると脱出します</div>`:`<div class="sub">屋上階段：自分のヘリが待機中（呼んだ2〜3ターン後）なら脱出できます</div>`;
  if(k===b.front||(v.backOpen&&k===b.back))return parts>=v.opt.partsNeed?`<div class="sub ok">🎭 変装パーツがそろっているので、止まると変装して脱出します（探偵が2マス以内にいると捕縛）</div>`:`<div class="sub">変装パーツが${v.opt.partsNeed}種類そろうと、ここから脱出できます</div>`;
  return "";
}
function teamHTML(v){

  <div class="sub">財宝のセキュリティ：${v.tr.filter(t=>!t.taken).map(t=>`${esc(t.name)}（${E.nm(t.k)}）${t.stage}/${t.need}段・失敗${t.fails}${t.alarm?"🚨":""}`).join("／")}</div>${v.floorHint?`<div class="sub">盗聴器：探偵は${v.floorHint.t}ターン目の終わりに${v.floorHint.f+1}階にいた</div>`:""}</div>`;
}
function detPanel(v){

    <div class="acts"><button class="primary" id="bcap">🫳 捕縛する<small>${v.opt.capture==="near2"?"2マス以内のマスを捜査":"このマスを調べる"}${d.net?"（包囲網）":""}</small></button>
    <button id="bamb" ${tp.stay?"":"disabled"}>👁 張り込み<small>${tp.stay?"上下左右1マスも捕縛・ターン終了":"留まるときだけ"}</small></button>

function infoHTML(d){const inf=(d.info||[]).slice(-6).reverse();return inf.length?`<div style="margin-top:8px"><b>調査メモ</b><div class="log">${inf.map(i=>`<div><span class="sub">${i.t}T</span> ${esc(i.m)}</div>`).join("")}</div></div>`:""}

/* ---------- ラウンド終了・ゲーム終了 ---------- */
function recTable(recs){
  const show=[["name","名前"],["role","役"],["status","結果"],["escHow","脱出"],["loot","財宝"],["notice","予告状"],["declared","予告"],["noticeOK","達成"],["share","山分け"],["noticeBonus","予告"],["flair","華麗さ"],["rescue","救出"],["bail","保釈金"],["endCapReward","捕縛報奨"],["capReward","累計捕縛"],["failReward","脱出失敗"],["blockReward","予告阻止"],["delta","増減"],["net","所持金(差引)"]];
  return `<div class="scroll"><table><tr>${show.map(c=>`<th>${c[1]}</th>`).join("")}</tr>${recs.map(r=>`<tr>${show.map(c=>`<td class="${typeof r[c[0]]==="number"?"n":""}">${esc(r[c[0]]===""?"-":r[c[0]])}</td>`).join("")}</tr>`).join("")}</table></div>`;
}
function renderRoundEnd(v){

  h+=`<div class="sub">ラウンドが終わったので、全員の位置を表示しています。</div>`+mapHTML(v,{});

}
function renderEnd(v){
  const rank=v.players.map(p=>({id:p.id,net:p.money-p.debt,det:p.totalDet})).sort((a,b)=>b.net-a.net||b.det-a.det);

  <div class="row" style="margin-top:8px"><button onclick="location.href=location.pathname">タイトルに戻る</button></div></div>`+`<div class="panel"><b>全ラウンドの記録</b>${recTable(v.records.filter(r=>r.gid===v.gid))}</div>`;

function openLog(){

function dlFile(name,text,type){const blob=new Blob([text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function stamp(){const d=new Date();const z=n=>String(n).padStart(2,"0");return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}`}
function download(kind){
  const g=S.game;const v=V();
  if(kind==="records"){const recs=g?g.records:v.records;dlFile(`imukat_${stamp()}_records.csv`,E.csvRecords({records:recs}),"text/csv");return}
  if(!g){toast("このファイルは部屋を作った人の画面から保存できます");return}
  if(kind==="actions")dlFile(`imukat_${stamp()}_actions.csv`,E.csvActions(g),"text/csv");
  else if(kind==="json")dlFile(`imukat_${stamp()}_alldata.json`,JSON.stringify(g,null,1),"application/json");
  else if(kind==="history"){const all=store.get("imukat_records")||{};const rows=Object.values(all).flat();if(!rows.length){toast("まだ記録がありません");return}dlFile(`imukat_history_${stamp()}.csv`,E.csvRecords({records:rows}),"text/csv")}
}
function openRules(tab){
  const d=dlg(`<div id="rbbox"></div><div class="sub" style="margin-top:8px"><a href="rules.html" target="_blank" rel="noopener">別のページで開く</a></div>`);
  if(window.IMUKAT_RULES)IMUKAT_RULES.render(document.getElementById("rbbox"),typeof tab==="string"?tab:null);
  else document.getElementById("rbbox").textContent="ルールを読み込めませんでした。ページを開き直してください。";
  d.scrollTop=0;
}

/* ---------- ボタンの割り当て ---------- */
function bind(){
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
  const v=V();
  document.querySelectorAll("[data-seat]").forEach(b=>b.onclick=()=>{S.seat=b.dataset.seat;S.ui={};broadcast()});
  on("brecon",()=>S.reconnect&&S.reconnect());
  on("bcopy",()=>{const i=$("#shareurl");i.select();try{navigator.clipboard.writeText(i.value)}catch(e){document.execCommand("copy")}toast("コピーしました")});
  on("bundo",()=>{const last=S.hist[S.hist.length-1];if(!last)return;if(!confirm(`「${last.label}」を取り消して、その前の状態に戻しますか？`))return;const e=undoLast();if(e)toast(e);else toast("1つ前に戻しました");S.ui={};broadcast()});
  document.querySelectorAll("[data-proxy]").forEach(b=>b.onclick=()=>{const id=b.dataset.proxy;if(!confirm(`${pname(id)}の代わりに進めますか？`))return;const err=hostApply(id,null,()=>E.proxyAct(S.game,id),`${pname(id)}の代わりに進める`);if(err)toast(err);broadcast()});
  if(v.phase==="lobby"&&isHost()){
    const save=()=>{const o=S.game.opt;o.thiefTimer=$("#o_tt").checked;o.thiefSec=Math.min(300,Math.max(10,+$("#o_ts").value||30));o.detTimer=$("#o_dt").checked;o.detSec=Math.min(300,Math.max(10,+$("#o_ds").value||90));
      o.items=$("#o_it").checked;o.skills=$("#o_sk").checked;o.capture=$("#o_cap").value;o.partsNeed=+$("#o_pn").value;o.turns=Math.min(20,Math.max(4,+$("#o_turns").value||12));o.rounds=+$("#o_rounds").value||null;broadcast()};
    ["o_tt","o_ts","o_dt","o_ds","o_it","o_sk","o_cap","o_pn","o_turns","o_rounds"].forEach(id=>{const e=document.getElementById(id);if(e)e.onchange=save});
    on("bstart",()=>{const err=hostApply(S.seat,{kind:"start"});if(err)toast(err);broadcast()});
  }
  on("bnext",()=>{const err=hostApply(S.seat,{kind:"nextRound"});if(err)toast(err);S.ui={};broadcast()});
  // 準備
  document.querySelectorAll("[data-skpick]").forEach(b=>b.onclick=()=>{const s=S.ui.skills=S.ui.skills||[];const id=b.dataset.skpick;const i=s.indexOf(id);if(i>=0)s.splice(i,1);else if(s.length<4)s.push(id);else toast("4つまでです");render()});
  on("bsetrand",()=>{const ks=Object.keys(E.SKILLS).sort(()=>Math.random()-.5);S.ui.skills=ks.slice(0,4);const ok=detStartSquares(V());S.ui.start=ok[Math.floor(Math.random()*ok.length)];render()});
  on("bsetdet",()=>{doAct({kind:"setupDet",k:S.ui.start,skills:S.ui.skills||[]});S.ui={}});
  on("bdecY",()=>{doAct({kind:"declare",yes:true,start:S.ui.tstart});S.ui.tstart=null});on("bdecN",()=>{doAct({kind:"declare",yes:false,start:S.ui.tstart});S.ui.tstart=null});
  document.querySelectorAll("[data-tstart]").forEach(b=>b.onclick=()=>{S.ui.tstart=+b.dataset.tstart;render()});
  // 怪盗
  on("broll",()=>doAct({kind:"roll"}));on("bstay",()=>doAct({kind:"stay"}));
  on("bheli",()=>{if(confirm("ヘリを呼びますか？（1ラウンド1回・全員に分かります）"))doAct({kind:"heli"})});
  on("bredest",()=>{S.ui.redest=true;toast("光っているマスから選び直してください")});
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{S.ui.act=b.dataset.act;render()});
  const cp=document.getElementById("cpick");if(cp)cp.onchange=()=>{S.ui.pick=cp.checked};
  on("bconf",()=>{if(v.role==="thief"){doAct({kind:"confirm",act:S.ui.act||"none",pick:S.ui.pick!==false});S.ui.act=null;S.ui.pick=true}});
  on("bunconf",()=>doAct({kind:"unconfirm"}));
  document.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>doAct({kind:"useItem",item:b.dataset.use}));
  on("bitemcancel",()=>{S.ui.itemTarget=null;render()});
  on("bgive",openGive);
  // 探偵
  on("bcap",()=>{if(v.opt.capture==="near2"){S.ui.capTarget=true;render();return}doAct({kind:"act",act:"capture"})});
  on("bcapcancel",()=>{S.ui.capTarget=false;render()});
  on("bamb",()=>doAct({kind:"act",act:"ambush"}));on("bpass",()=>doAct({kind:"act",act:"pass"}));
  on("bendturn",()=>{if(confirm("このターンを終えますか？"))doAct({kind:"endTurn"})});
  // マップ
  document.querySelectorAll(".cell").forEach(el=>el.onclick=()=>cellTap(+el.dataset.k));
}
function detStartSquares(v){const b=E.bld({building:v.bid});const fx=[b.front,b.back,...b.stairs.flat(),...b.roof,...b.windows];
  return Array.from({length:64},(_,i)=>64+i).filter(k=>!fx.includes(k)&&!v.tr.some(t=>t.k===k)&&!v.parts.some(x=>x.k===k))}
function cellTap(k){
  const v=V();
  if(v.phase==="setup"&&v.role==="det"&&!v.det.ready){if(k<64){toast("スタートは2階から選んでください");return}if(!detStartSquares(v).includes(k)){toast("何もないマスを選んでください（財宝・変装パーツ・階段・窓・屋上階段は選べません）");return}S.ui.start=k;render();return}
  if(v.phase==="setup"&&v.role==="thief"&&v.my.declared==null&&E.bld({building:v.bid}).starts.includes(k)){S.ui.tstart=k;render();return}
  if(v.phase==="play"&&v.role==="thief"&&v.stage==="thief"){
    if(S.ui.itemTarget){const it=S.ui.itemTarget;S.ui.itemTarget=null;doAct({kind:"useItem",item:it,k});return}
    const tp=v.my.tp,me=myThief(v);
    if(tp&&!tp.done&&tp.roll!=null&&!tp.stay&&me.status==="active"){if(reachV(v,me.k,tp.roll).includes(k)){S.ui.act=null;doAct({kind:"dest",k});return}}
  }
  if(v.phase==="play"&&v.role==="det"&&v.stage==="det"){
    const tp=v.det.tp;
    if(S.ui.capTarget){if(E.dist(k,tp.dest)>2){toast("2マス以内のマスを選んでください");return}S.ui.capTarget=false;doAct({kind:"act",act:"capture",target:k});return}
    if(tp&&tp.roll!=null&&!tp.stay&&reachV(v,v.det.k,tp.roll).includes(k)){doAct({kind:"dest",k});return}
  }
  cellInfo(k);
}
function cellInfo(k){
  const v=V();const b=E.bld({building:v.bid});const t=[];
  if(k===b.front)t.push("正面ゲート");if(k===b.back)t.push("裏口"+(v.backOpen?"（開いている）":""));if(b.roof.includes(k))t.push("屋上階段");if(b.windows.includes(k))t.push("窓");
  b.stairs.forEach(p=>{if(p.includes(k))t.push(`階段（${E.nm(p[0])}⇔${E.nm(p[1])}）`)});
  const tr=v.tr.find(x=>x.k===k&&!x.taken);if(tr)t.push(`財宝「${tr.name}」（${E.TR[tr.rank].label}・${tr.value}万円）${tr.alarm?"🚨警報":""}${v.role==="det"?(tr.seen?`／${tr.seen.t}ターン目に調査：${tr.seen.taken?"盗まれていた":`まだあった（${tr.seen.stage}/${tr.seen.need}段階・失敗${tr.seen.fails}回）`}`:"／未調査"):""}`);
  const pt=v.parts.find(x=>x.k===k&&!x.taken);if(pt)t.push(`変装パーツ「${E.PARTS[pt.type]}」${v.role==="det"?(pt.seen?`／${pt.seen.t}ターン目に調査：${pt.seen.taken?"なくなっていた":"まだあった"}`:"／未調査"):""}`);
  const fps=(v.prints||[]).filter(x=>x.k===k);if(fps.length)t.push("足跡："+fps.map(x=>pname(x.pid)+(x.age?"（2ターン前）":"（1ターン前）")).join("・"));
  toast(`${E.nm(k)}${t.length?"："+t.join("／"):""}`);
}
function openGive(){
  const v=V();const me=myThief(v);const mates=v.thieves.filter(t=>t.id!==me.id&&t.status==="active"&&t.k===me.k);
  const opts=[...me.loot.map(id=>({k:"loot",val:id,label:"財宝「"+v.tr.find(t=>t.id===id).name+"」"})),...v.my.items.map(it=>({k:"item",val:it,label:"アイテム「"+E.ITEMS[it].name+"」"})),...E.PART_KEYS.filter(x=>(me.parts[x]||0)>0).map(x=>({k:"part",val:x,label:"変装パーツ「"+E.PARTS[x]+"」"}))];
  const d=dlg(`<h2 style="margin-top:0">🤝 仲間に渡す</h2>${opts.length?mates.map(m=>`<div class="card">${chip(m.id)} に渡す<div class="acts">${opts.map(o=>`<button data-gto="${m.id}" data-gk="${o.k}" data-gv="${o.val}">${esc(o.label)}</button>`).join("")}</div></div>`).join(""):`<div class="sub">渡せるものがありません</div>`}`);
  d.querySelectorAll("[data-gto]").forEach(b=>b.onclick=()=>{d.close();const a={kind:"give",to:b.dataset.gto};a[b.dataset.gk]=b.dataset.gv;doAct(a)});
}
/* 起動 */
render();
if(_qs.get("room")){setTimeout(()=>{const n=$("#jname");if(n&&!n.value)n.focus()},0)}
window.__S=S;
</script>
